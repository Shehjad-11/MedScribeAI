<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner & Watermark -->
  <rect x="0" y="0" width="800" height="40" fill="#dc2626"/>
  <text x="400" y="26" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    *** SYNTHETIC MEDICAL FIXTURE — ZERO REAL PATIENT DATA — FOR TESTING ONLY ***
  </text>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="#f1f5f9" text-anchor="middle" transform="rotate(-30 400 520)">
    SYNTHETIC DEMO
  </text>

  <!-- Clinic Header -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">PRIMARY HEALTH CLINIC (SYNTHETIC)</text>
  <text x="50" y="115" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Sector 4, Community Health Center | Reg: P-88291</text>
  <line x1="50" y1="130" x2="750" y2="130" stroke="#0ea5e9" stroke-width="3"/>

  <!-- Patient Details -->
  <text x="50" y="165" font-family="Arial, sans-serif" font-size="15" fill="#334155"><tspan font-weight="bold">Patient Name:</tspan> Rajesh Sharma (Synthetic)</text>
  <text x="450" y="165" font-family="Arial, sans-serif" font-size="15" fill="#334155"><tspan font-weight="bold">Date:</tspan> 2026-09-15</text>
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="15" fill="#334155"><tspan font-weight="bold">Age / Sex:</tspan> 52 Yrs / Male</text>
  <text x="450" y="195" font-family="Arial, sans-serif" font-size="15" fill="#334155"><tspan font-weight="bold">Encounter:</tspan> Routine Cardioprotective Follow-up</text>
  <line x1="50" y1="215" x2="750" y2="215" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Rx Section -->
  <text x="50" y="270" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#2563eb">Rx</text>
  
  <!-- Prescription 1 -->
  <rect x="50" y="295" width="700" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="325" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">1. Tab. Atorvastatin 20 mg</text>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="14" fill="#475569">Dosage: 1 Tablet at bedtime (0 - 0 - 1) | Duration: 30 Days</text>
  <text x="70" y="372" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#64748b">Instructions: Take with water after evening meal</text>

  <!-- Prescription 2 -->
  <rect x="50" y="405" width="700" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="435" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">2. Tab. Ecosprin (Aspirin) 75 mg</text>
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="14" fill="#475569">Dosage: 1 Tablet daily after breakfast (1 - 0 - 0) | Duration: 30 Days</text>
  <text x="70" y="482" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#64748b">Instructions: Take immediately after food</text>

  <!-- Clinician Notes -->
  <text x="50" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">Advice / Precautions:</text>
  <text x="50" y="565" font-family="Arial, sans-serif" font-size="14" fill="#475569">- Salt restriction (&lt;5g/day), daily 30-minute brisk walk.</text>
  <text x="50" y="590" font-family="Arial, sans-serif" font-size="14" fill="#475569">- Return immediately if experiencing crushing chest pain, dyspnea, or cold sweats.</text>

  <!-- Doctor Signature Box -->
  <rect x="500" y="800" width="250" height="110" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="520" y="830" font-family="Brush Script MT, cursive" font-size="26" fill="#1e40af">Dr. S. Clinician</text>
  <text x="520" y="860" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Dr. Synthetic Clinician, MBBS</text>
  <text x="520" y="880" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Medical Officer (Reg: SYN-10023)</text>
  <text x="520" y="898" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Date: 2026-09-15</text>
</svg>
